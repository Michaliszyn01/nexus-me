[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-me"
version = "0.1.0"
description = "Memória pessoal com fontes, conversa local e GPT sob demanda"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
nexus-me = "nexus_me.__main__:main"

[tool.setuptools.packages.find]
include = ["nexus_me*"]
